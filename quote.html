<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Free Quote | Legacy Traffic Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="quote-page">

    <h1>Get a Free Quote</h1>

    <p>
        Complete the form below and we'll get back to you as soon as possible.
    </p>

    <form class="quote-form" action="https://formspree.io/f/maqrdzlz" method="POST">

    <input type="text" name="Full Name" placeholder="Full Name" required>

    <input type="email" name="Email Address" placeholder="Email Address" required>

    <input type="tel" name="Phone Number" placeholder="Phone Number" required>

    <input type="text" name="Company Name" placeholder="Company Name">

    <input type="text" name="Project Location" placeholder="Project Location">

    <textarea name="Project Details" placeholder="Tell us about your project..." rows="6"></textarea>

    <button type="submit">Submit Quote Request</button>

</form>

</section>

</body>
</html>
